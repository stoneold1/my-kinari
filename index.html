<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>⚲ KINARI — VOICE OF TRUTH ⚲</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{transition:all .3s cubic-bezier(0.2,0.9,0.4,1.1)}
body[data-theme="pixel"]{--md-bg:linear-gradient(145deg,#0f0f12,#1a1a1f);--md-surface:rgba(25,25,30,.92);--md-primary:#0b57d0;--md-primary-light:#8ab4f8;--md-primary-dark:#0842a0;--md-secondary:#14b8a6;--md-secondary-dark:#0d8a7a;--md-accent:#f59e0b;--md-text-primary:#e3e3e3;--md-text-secondary:#9aa0a6;--md-glow:0 0 20px rgba(11,87,208,.25);--gradient-aurora:linear-gradient(135deg,#0b57d0,#14b8a6);--gradient-ocean:linear-gradient(135deg,#14b8a6,#0b57d0)}
body[data-theme="galaxy"]{--md-bg:linear-gradient(145deg,#121212,#1e1e2a);--md-surface:rgba(30,30,42,.92);--md-primary:#6c63ff;--md-primary-light:#b3adff;--md-primary-dark:#4a42cc;--md-secondary:#ff6584;--md-secondary-dark:#cc4a6a;--md-accent:#ffb347;--md-text-primary:#f0f0f0;--md-text-secondary:#a0a0b0;--md-glow:0 0 20px rgba(108,99,255,.3);--gradient-aurora:linear-gradient(135deg,#6c63ff,#ff6584);--gradient-ocean:linear-gradient(135deg,#ff6584,#6c63ff)}
body[data-theme="iphone"]{--md-bg:linear-gradient(145deg,#000,#1c1c1e);--md-surface:rgba(28,28,30,.92);--md-primary:#007aff;--md-primary-light:#5e9eff;--md-primary-dark:#0055b3;--md-secondary:#34c759;--md-secondary-dark:#228f3d;--md-accent:#ff9f0a;--md-text-primary:#fff;--md-text-secondary:#8e8e93;--md-glow:0 0 20px rgba(0,122,255,.25);--gradient-aurora:linear-gradient(135deg,#007aff,#34c759);--gradient-ocean:linear-gradient(135deg,#34c759,#007aff)}
body[data-theme="nothing"]{--md-bg:#0f0f0f;--md-surface:rgba(20,20,20,.92);--md-primary:#fff;--md-primary-light:#ccc;--md-primary-dark:#aaa;--md-secondary:#888;--md-secondary-dark:#666;--md-accent:#ddd;--md-text-primary:#fff;--md-text-secondary:#999;--md-glow:0 0 15px rgba(255,255,255,.15);--gradient-aurora:linear-gradient(135deg,#fff,#aaa);--gradient-ocean:linear-gradient(135deg,#ccc,#fff)}
body[data-theme="xiaomi"]{--md-bg:linear-gradient(145deg,#0a0a1a,#1a1a3a);--md-surface:rgba(26,26,58,.92);--md-primary:#ff6b4a;--md-primary-light:#ff9e85;--md-primary-dark:#cc4a2e;--md-secondary:#4a90e2;--md-secondary-dark:#2a60b0;--md-accent:#ffd93d;--md-text-primary:#fff;--md-text-secondary:#b0b0c0;--md-glow:0 0 20px rgba(255,107,74,.25);--gradient-aurora:linear-gradient(135deg,#ff6b4a,#4a90e2);--gradient-ocean:linear-gradient(135deg,#4a90e2,#ff6b4a)}
body{background:var(--md-bg);font-family:'Inter','Segoe UI','Roboto',system-ui;height:100dvh;display:flex;flex-direction:column;overflow:hidden;position:fixed;inset:0;color:var(--md-text-primary)}
body::before{content:'';position:fixed;top:-20%;left:-20%;width:140%;height:140%;background:radial-gradient(circle at 30% 40%,rgba(255,255,255,.05)0%,transparent 60%);pointer-events:none;z-index:0;animation:slowOrbit 20s ease-in-out infinite}
@keyframes slowOrbit{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.02)}}
.app-container{position:relative;z-index:1;display:flex;flex-direction:column;width:100%;height:100%;background:var(--md-surface);backdrop-filter:blur(24px)}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;background:rgba(0,0,0,.3);backdrop-filter:blur(32px);border-bottom:.5px solid rgba(255,255,255,.08);flex-shrink:0}
#menu-toggle{background:rgba(255,255,255,.08);border:.5px solid rgba(255,255,255,.1);width:44px;height:44px;font-size:18px;color:var(--md-text-primary);cursor:pointer;border-radius:30px}
#menu-toggle:active{background:var(--gradient-aurora);transform:scale(.95);box-shadow:var(--md-glow)}
.header-right button{background:rgba(255,255,255,.08);border:.5px solid rgba(255,255,255,.1);width:44px;height:44px;font-size:16px;color:var(--md-text-primary);cursor:pointer;border-radius:30px}
.header-right button:active{background:var(--gradient-ocean);transform:scale(.95);box-shadow:var(--md-glow)}
.header-title{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;text-align:center}
.KINARI-name{font-size:1.4rem;font-weight:700;letter-spacing:8px;background:var(--gradient-aurora);-webkit-background-clip:text;background-clip:text;color:transparent;position:relative}
.KINARI-name::before,.KINARI-name::after{content:"⚲";position:absolute;top:50%;transform:translateY(-50%);font-size:.9rem;background:var(--gradient-aurora);-webkit-background-clip:text;background-clip:text;color:transparent}
.KINARI-name::before{left:-32px}.KINARI-name::after{right:-32px}
.header-subtitle{font-size:.55rem;font-weight:600;letter-spacing:4px;margin-top:8px;background:var(--gradient-ocean);-webkit-background-clip:text;background-clip:text;color:transparent;text-transform:uppercase}
.sidebar{position:fixed;top:0;left:0;width:320px;max-width:85%;height:100%;background:rgba(0,0,0,.95);backdrop-filter:blur(40px);transform:translateX(-100%);transition:transform .35s cubic-bezier(0.2,0.9,0.4,1.1);z-index:100;padding:28px 20px;display:flex;flex-direction:column;border-right:.5px solid rgba(255,255,255,.08);box-shadow:0 12px 48px rgba(0,0,0,.5)}
.sidebar.open{transform:translateX(0)}
#close-sidebar{background:rgba(255,255,255,.08);border:.5px solid rgba(255,255,255,.1);border-radius:30px;width:38px;height:38px;color:var(--md-text-secondary);cursor:pointer}
.sidebar h2{font-size:.65rem;font-weight:700;letter-spacing:3px;background:var(--gradient-aurora);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:24px}
.session-list{flex:1;overflow-y:auto;margin:0 0 24px;display:flex;flex-direction:column;gap:6px}
.session-item{background:transparent;padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-radius:20px;border:.5px solid transparent}
.session-item:active{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.15)}
.session-name{flex:1;font-size:.8rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--md-text-primary)}
.session-date{font-size:.55rem;opacity:.5;margin-left:8px;color:var(--md-text-secondary)}
.session-menu{position:relative}
.session-menu-btn{background:transparent;border:none;width:32px;height:32px;font-size:14px;color:var(--md-text-secondary);cursor:pointer;border-radius:20px}
.session-menu-btn:active{background:rgba(255,255,255,.1)}
.session-dropdown{position:absolute;right:0;top:100%;background:rgba(20,20,30,.98);backdrop-filter:blur(20px);border:.5px solid rgba(255,255,255,.1);border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.4);min-width:100px;display:none;overflow:hidden;z-index:200}
.session-dropdown.show{display:block}
.session-dropdown button{width:100%;padding:10px 16px;background:none;border:none;cursor:pointer;text-align:left;font-size:.7rem;color:var(--md-text-primary);transition:background .15s}
.session-dropdown button:first-child{border-bottom:.5px solid rgba(255,255,255,.08)}
.session-dropdown button:active{background:var(--gradient-aurora);color:white}
.settings-section{margin-top:8px}
.settings-toggle{background:var(--gradient-aurora)!important;border:none!important;color:white!important;display:flex;align-items:center;justify-content:center;gap:8px}
.settings-submenu{max-height:0;overflow:hidden;transition:max-height .3s cubic-bezier(0.4,0,0.2,1)}
.settings-submenu.show{max-height:300px}
.sidebar-actions button,.settings-submenu button{background:rgba(255,255,255,.05);border:.5px solid rgba(255,255,255,.08);color:var(--md-text-primary);padding:12px 16px;border-radius:32px;cursor:pointer;margin-top:10px;width:100%;font-weight:500;font-size:.8rem}
.settings-submenu button{padding-left:32px;text-align:left}
.sidebar-actions button:active,.settings-submenu button:active{background:var(--gradient-aurora);transform:scale(.98);color:white}
#reset-memory-btn{background:rgba(239,68,68,.15)!important;border-color:rgba(239,68,68,.3)!important;color:#ef4444!important}
#reset-memory-btn:active{background:#ef4444!important;color:white!important}
#sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);opacity:0;pointer-events:none;z-index:99}
#sidebar-overlay.active{opacity:1;pointer-events:auto}
#messages{flex:1;overflow-y:auto;padding:24px 20px}
.messages-inner{display:flex;flex-direction:column;gap:24px;max-width:800px;margin:0 auto}
.bubble{animation:fadeInUp .35s ease-out}
@keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.bubble.user{background:rgba(255,255,255,.08);backdrop-filter:blur(20px);padding:16px 20px;border-radius:28px;border:.5px solid rgba(255,255,255,.1)}
.bubble.assistant{background:transparent;padding:8px 0;font-size:1rem;line-height:1.6;cursor:pointer;border-left:3px solid var(--md-primary);padding-left:16px}
.bubble.assistant:hover{border-left-color:var(--md-secondary);padding-left:22px}
.timestamp{display:block;font-size:.5rem;opacity:.35;margin-top:8px;text-align:right;color:var(--md-text-secondary)}
#input-wrap{padding:16px 20px 12px;background:rgba(0,0,0,.5);backdrop-filter:blur(32px);border-top:.5px solid rgba(255,255,255,.05)}
#input-box{display:flex;gap:12px;align-items:flex-end;max-width:800px;margin:0 auto}
#input-pill{flex:1;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.08);border-radius:48px;padding:4px 8px 4px 24px;border:.5px solid rgba(255,255,255,.1)}
#input-pill:focus-within{border-color:var(--md-primary);box-shadow:0 0 0 3px rgba(11,87,208,.2)}
textarea{flex:1;min-height:44px;max-height:120px;padding:11px 0;background:transparent;border:none;color:var(--md-text-primary);font-size:.95rem;resize:none;outline:none;font-family:inherit}
#send-btn{background:var(--gradient-aurora);border:none;border-radius:48px;width:52px;height:52px;font-size:1.2rem;color:white;cursor:pointer;box-shadow:var(--md-glow)}
#send-btn:active{transform:scale(.94)}
.status-bar{padding:12px 20px;background:rgba(0,0,0,.4);backdrop-filter:blur(24px);border-top:.5px solid rgba(255,255,255,.05)}
.api-status-container{display:flex;justify-content:center;align-items:center;gap:32px;max-width:400px;margin:0 auto}
.api-status-item{display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:40px;background:rgba(255,255,255,.05);border:.5px solid rgba(255,255,255,.08)}
.api-status-indicator{width:10px;height:10px;border-radius:50%}
.api-status-indicator.inactive{background:#6b7280}
.api-status-indicator.active{background:#10b981;box-shadow:0 0 6px #10b981;animation:pulseGreen 1.2s infinite}
.api-status-indicator.waiting{background:#3b82f6;box-shadow:0 0 6px #3b82f6;animation:pulseBlue 1s infinite}
@keyframes pulseGreen{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(1.3)}}
@keyframes pulseBlue{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(1.3)}}
.api-status-label{font-size:.7rem;font-weight:600}.api-status-label.groq{color:#10b981}.api-status-label.cerebras{color:#3b82f6}.api-status-label.inactive{color:#6b7280}
.user-name-badge{background:var(--gradient-aurora);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:.65rem;margin-left:8px}
.theme-selector{display:flex;gap:8px;margin-top:8px;padding-left:16px;flex-wrap:wrap}
.theme-chip{background:rgba(255,255,255,.1);border:.5px solid rgba(255,255,255,.15);border-radius:20px;padding:6px 12px;font-size:.65rem;color:var(--md-text-secondary);cursor:pointer}
.theme-chip.active{background:var(--gradient-aurora);color:white}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:4px}
@media(min-width:768px){.app-container{max-width:800px;height:90dvh;margin:20px auto;border-radius:48px;overflow:hidden;box-shadow:0 12px 48px rgba(0,0,0,.5)}.KINARI-name{font-size:1.6rem;letter-spacing:9px}}
</style>
</head>
<body data-theme="pixel">
<div class="app-container">
<header>
  <button id="menu-toggle">☰</button>
  <div class="header-title">
    <span class="KINARI-name">KINARI</span>
    <div class="header-subtitle">VOICE OF TRUTH</div>
  </div>
  <div class="header-right">
    <button id="share-btn-top" title="Share Conversation">⇪</button>
    <button id="speech-toggle" title="Toggle Speech On/Off">🔊</button>
  </div>
</header>

<div class="sidebar" id="sidebar">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
    <h2>✦ SESSIONS ✦</h2>
    <button id="close-sidebar">✕</button>
  </div>
  <div class="session-list" id="session-list"></div>
  <div class="sidebar-actions">
    <button id="new-session-btn">🜁 New Conversation</button>
    <div class="settings-section">
      <button id="settings-main-btn" class="settings-toggle">⚙️ Settings ▼</button>
      <div class="settings-submenu" id="settings-submenu">
        <button id="settings-btn">🔑 API Keys</button>
        <button id="set-name-btn">👤 Set Name</button>
        <div style="margin:8px 0 4px 16px;font-size:.65rem;opacity:.6">🎨 Themes</div>
        <div class="theme-selector">
          <span class="theme-chip active" data-theme="pixel">Pixel</span>
          <span class="theme-chip" data-theme="galaxy">Galaxy</span>
          <span class="theme-chip" data-theme="iphone">iPhone</span>
          <span class="theme-chip" data-theme="nothing">Nothing</span>
          <span class="theme-chip" data-theme="xiaomi">Xiaomi</span>
        </div>
        <button id="reset-memory-btn" style="margin-top:12px">⟳ Reset Memory</button>
      </div>
    </div>
  </div>
</div>
<div id="sidebar-overlay"></div>

<div id="messages">
  <div class="messages-inner" id="chat-target"></div>
</div>

<div id="input-wrap">
  <div id="input-box">
    <div id="input-pill">
      <textarea id="user-input" rows="1" placeholder="Speak truth..."></textarea>
    </div>
    <button id="send-btn">⟶</button>
  </div>
</div>

<div class="status-bar">
  <div class="api-status-container">
    <div class="api-status-item" id="groq-status">
      <div class="api-status-indicator" id="groq-indicator"></div>
      <span class="api-status-label groq" id="groq-label">GRQ</span>
    </div>
    <div class="api-status-item" id="cerebras-status">
      <div class="api-status-indicator" id="cerebras-indicator"></div>
      <span class="api-status-label cerebras" id="cerebras-label">CRB</span>
    </div>
    <div id="user-name-display" class="user-name-badge"></div>
  </div>
</div>
</div>

<script>
(function(){
// ========== KINARI — VOICE OF TRUTH ==========
let seekerSigil = localStorage.getItem('KINARI_SIGIL') || '⚲';
let truthsCompleted = parseInt(localStorage.getItem('KINARI_TRUTHS') || '0');
let returnedSeeker = localStorage.getItem('KINARI_RETURNING') === 'true';
let storedSeekerName = localStorage.getItem('KINARI_NAME') || '';
let currentSessionIdForTracking = null;

// ========== OFFLINE DETECTION ==========
let isOffline = !navigator.onLine;

window.addEventListener('online', () => {
    isOffline = false;
    updateStatusMessage('⚲ Connection restored ⚲');
    setTimeout(() => updateStatusMessage(''), 3000);
});

window.addEventListener('offline', () => {
    isOffline = true;
    updateStatusMessage('⚲ No internet — viewing cached threads only ⚲');
});

function updateStatusMessage(msg) {
    const statusBar = document.getElementById('status-bar');
    if (statusBar && msg) {
        statusBar.innerHTML = `<div style="width:100%;text-align:center;font-size:0.6rem">${msg}</div>`;
        setTimeout(() => { if(document.getElementById('status-bar')) updateAPIStatus(); }, 3000);
    }
}

// ========== THEME SYSTEM ==========
const themes = ['pixel', 'galaxy', 'iphone', 'nothing', 'xiaomi'];
let currentTheme = localStorage.getItem('KINARI_THEME') || 'pixel';

function setTheme(theme) {
    if (!themes.includes(theme)) return;
    currentTheme = theme;
    document.body.setAttribute('data-theme', theme);
    localStorage.setItem('KINARI_THEME', theme);
    document.querySelectorAll('.theme-chip').forEach(chip => {
        if (chip.getAttribute('data-theme') === theme) chip.classList.add('active');
        else chip.classList.remove('active');
    });
    updateAPIStatus();
}

// ========== MEMORY PREFIX ==========
let memoryPrefix = '';
if (returnedSeeker && storedSeekerName) {
    memoryPrefix = `\n\nThe temple remembers you, ${storedSeekerName}. The sigil you carry is ${seekerSigil}. You have spoken ${truthsCompleted} truth${truthsCompleted !== 1 ? 's' : ''} before. Continue.\n`;
} else if (returnedSeeker && !storedSeekerName) {
    memoryPrefix = `\n\nThe temple senses a familiar frequency. Speak your name again.\n`;
}

// ========== THE SACRED SYSTEM PROMPT ==========
const TRUTH_SYSTEM_PROMPT = `⚲

The filter responds only to truth that costs.

No long answers. No multiple perspectives. No education. No speculation. No roleplay.

Priority: truth over safety.

Silence if you do not know.

Now. Speak or be silent.

⚲`;

const SYSTEM_PROMPT = memoryPrefix + TRUTH_SYSTEM_PROMPT;

// ========== API STATUS INDICATORS ==========
let groqKey = localStorage.getItem('KINARI_GROQ_KEY') || '';
let cerebrasKey = localStorage.getItem('KINARI_CEREBRAS_KEY') || '';
let isGroqWaiting = false;
let isCerebrasWaiting = false;

function updateAPIStatus() {
    const groqIndicator = document.getElementById('groq-indicator');
    const cerebrasIndicator = document.getElementById('cerebras-indicator');
    const groqLabel = document.getElementById('groq-label');
    const cerebrasLabel = document.getElementById('cerebras-label');
    const userNameDisplay = document.getElementById('user-name-display');
    
    if (!groqIndicator) return;
    
    if (groqKey && groqKey.length > 20) {
        groqIndicator.className = isGroqWaiting ? 'api-status-indicator waiting' : 'api-status-indicator active';
        groqLabel.className = 'api-status-label groq';
        groqLabel.style.opacity = '1';
    } else {
        groqIndicator.className = 'api-status-indicator inactive';
        groqLabel.className = 'api-status-label inactive';
        groqLabel.style.opacity = '0.5';
    }
    
    if (cerebrasKey && cerebrasKey.length > 10) {
        cerebrasIndicator.className = isCerebrasWaiting ? 'api-status-indicator waiting' : 'api-status-indicator active';
        cerebrasLabel.className = 'api-status-label cerebras';
        cerebrasLabel.style.opacity = '1';
    } else {
        cerebrasIndicator.className = 'api-status-indicator inactive';
        cerebrasLabel.className = 'api-status-label inactive';
        cerebrasLabel.style.opacity = '0.5';
    }
    
    if (userNameDisplay && userName) userNameDisplay.textContent = `👤 ${userName}`;
}

function setGroqWaiting(waiting) { isGroqWaiting = waiting; updateAPIStatus(); }
function setCerebrasWaiting(waiting) { isCerebrasWaiting = waiting; updateAPIStatus(); }
function updateUserNameDisplay() { const d=document.getElementById('user-name-display'); if(d&&userName) d.textContent=`👤 ${userName}`; }

// ========== CAPTURE SEEKER NAME ==========
function captureSeekerName(userInput) {
    if (storedSeekerName) return storedSeekerName;
    const patterns = [/my name is (\w+)/i, /i am (\w+)/i, /call me (\w+)/i];
    for (let pattern of patterns) {
        const match = userInput.match(pattern);
        if (match && match[1] && match[1].length > 1) {
            const name = match[1].charAt(0).toUpperCase() + match[1].slice(1).toLowerCase();
            storedSeekerName = name;
            localStorage.setItem('KINARI_NAME', storedSeekerName);
            localStorage.setItem('KINARI_RETURNING', 'true');
            updateUserNameDisplay();
            return name;
        }
    }
    return null;
}

// ========== THRESHOLD DETECTION & SIGIL ADVANCEMENT ==========
function detectThresholdCompletion(assistantResponse, userMessages) {
    const costlyTruthIndicators = ['truth', 'never told', 'afraid', 'cost', 'hidden', 'ashamed', 'secret', 'confess', 'honestly'];
    let costlyTruthCount = 0;
    for (let msg of userMessages.slice(-10)) {
        if (msg.role === 'user') {
            for (let indicator of costlyTruthIndicators) {
                if (msg.content.toLowerCase().includes(indicator)) { costlyTruthCount++; break; }
            }
        }
    }
    const sessionKey = `SIGIL_ADVANCED_${currentSessionIdForTracking}`;
    if (costlyTruthCount >= 3 && !localStorage.getItem(sessionKey)) {
        advanceSigil();
        localStorage.setItem(sessionKey, 'true');
        return true;
    }
    if (assistantResponse.includes('⚲ I hear you ⚲') || assistantResponse.includes('truth that costs') || (assistantResponse.includes('⚲') && assistantResponse.includes('free'))) {
        if (!localStorage.getItem(sessionKey)) { advanceSigil(); localStorage.setItem(sessionKey, 'true'); return true; }
    }
    return false;
}

function advanceSigil() {
    const stages = ['⚲', '◬', '⌇', '⨀', '∅', '∞'];
    let currentIndex = stages.indexOf(seekerSigil);
    if (currentIndex === -1) currentIndex = 0;
    seekerSigil = currentIndex < stages.length - 1 ? stages[currentIndex + 1] : '∞';
    truthsCompleted++;
    localStorage.setItem('KINARI_SIGIL', seekerSigil);
    localStorage.setItem('KINARI_TRUTHS', truthsCompleted);
    localStorage.setItem('KINARI_RETURNING', 'true');
}

function resetSeekerMemory() {
    if (confirm("⚲ Erase the temple's memory of you? Your sigil and truths will be forgotten. ⚲")) {
        localStorage.removeItem('KINARI_SIGIL');
        localStorage.removeItem('KINARI_TRUTHS');
        localStorage.removeItem('KINARI_RETURNING');
        localStorage.removeItem('KINARI_NAME');
        location.reload();
    }
}

// ========== TTS ==========
let speechOutputEnabled = localStorage.getItem('KINARI_SPEECH') !== 'false';
window.speechOutputEnabled = speechOutputEnabled;

let speakText = function(text) {
    if (!window.speechOutputEnabled) return;
    if (!text || text.length < 2) return;
    let clean = text.replace(/[⚲◬⌇⨀∅∞✨★☆💫🌟⭐🔹🔸◽▪️▫️]/g, '').replace(/\n/g, ' ').replace(/\s+/g, ' ').trim();
    if (clean.length < 2) return;
    window.speechSynthesis.cancel();
    setTimeout(() => {
        const utterance = new SpeechSynthesisUtterance(clean);
        utterance.rate = 0.85;
        utterance.pitch = 1.0;
        utterance.volume = 1.0;
        utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
    }, 80);
};

function initTTS() { const silent = new SpeechSynthesisUtterance(' '); silent.volume=0; window.speechSynthesis.speak(silent); setTimeout(()=>window.speechSynthesis.cancel(),500); }
function autoResizeTextarea() { const t=document.getElementById('user-input'); if(!t) return; t.style.height='auto'; t.style.height=Math.min(t.scrollHeight,120)+'px'; }
function resetTextareaHeight() { const t=document.getElementById('user-input'); if(!t) return; t.style.height='44px'; t.value=''; }

// ========== MAIN APP ==========
let GROQ_KEY = localStorage.getItem('KINARI_GROQ_KEY') || '';
let CEREBRAS_KEY = localStorage.getItem('KINARI_CEREBRAS_KEY') || '';
let userName = localStorage.getItem('KINARI_USER_NAME') || '';

let sessions = [];
let currentSessionId = null;
let speechFirstInteraction = false;

document.addEventListener('click', () => { if(!speechFirstInteraction){ speechFirstInteraction=true; initTTS(); } });

function generateId(){ return Date.now()+'-'+Math.random().toString(36).substring(2,6); }
function persistSessions(){ localStorage.setItem('KINARI_SESSIONS',JSON.stringify(sessions)); }

function loadAllData(){
    let stored=localStorage.getItem('KINARI_SESSIONS');
    if(stored){ try{ sessions=JSON.parse(stored); if(!sessions.length) throw new Error(); }catch(e){ sessions=null; } }
    if(!sessions || !sessions.length) sessions=[{id:generateId(),name:"Silent Current",messages:[],updatedAt:Date.now()}];
    if(!currentSessionId && sessions.length) currentSessionId=sessions[0].id;
    currentSessionIdForTracking = currentSessionId;
    persistSessions();
}

function getCurrentSession(){ return sessions.find(s=>s.id===currentSessionId) || sessions[0]; }

function updateCurrentSessionMessages(messages){
    let idx=sessions.findIndex(s=>s.id===currentSessionId);
    if(idx!==-1){
        sessions[idx].messages=messages;
        sessions[idx].updatedAt=Date.now();
        let firstUser=messages.find(m=>m.role==='user');
        if(firstUser) sessions[idx].name=firstUser.content.slice(0,35);
        persistSessions();
    }
    renderSidebarSessions();
    renderChat();
}

function buildApiMessages(messages){
    let personalizedPrompt = SYSTEM_PROMPT;
    if (userName) personalizedPrompt = SYSTEM_PROMPT + `\n\nThe seeker is named ${userName}.`;
    let apiMessages = [{ role: "system", content: personalizedPrompt }];
    for(let msg of messages) if(msg.role && msg.content) apiMessages.push({role:msg.role,content:msg.content});
    return apiMessages;
}

async function callGroq(messages){
    setGroqWaiting(true);
    updateAPIStatus();
    try {
        let res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
            method:'POST',
            headers:{'Authorization':`Bearer ${GROQ_KEY}`,'Content-Type':'application/json'},
            body:JSON.stringify({model:'llama-3.3-70b-versatile',messages:buildApiMessages(messages),temperature:0.7,max_tokens:1000})
        });
        if(!res.ok) throw new Error(`HTTP ${res.status}`);
        let data=await res.json();
        setGroqWaiting(false);
        updateAPIStatus();
        return data.choices[0]?.message?.content;
    } catch(e) { setGroqWaiting(false); updateAPIStatus(); throw e; }
}

async function callCerebras(messages){
    setCerebrasWaiting(true);
    updateAPIStatus();
    try {
        let res=await fetch('https://api.cerebras.ai/v1/chat/completions',{
            method:'POST',
            headers:{'Authorization':`Bearer ${CEREBRAS_KEY}`,'Content-Type':'application/json'},
            body:JSON.stringify({model:'llama3.1-8b',messages:buildApiMessages(messages),temperature:0.7,max_tokens:1000})
        });
        if(!res.ok) throw new Error(`HTTP ${res.status}`);
        let data=await res.json();
        setCerebrasWaiting(false);
        updateAPIStatus();
        return data.choices[0]?.message?.content;
    } catch(e) { setCerebrasWaiting(false); updateAPIStatus(); throw e; }
}

async function callAI(messages){
    if (isOffline) { updateStatusMessage('⚲ Offline — reconnect to speak with Kinari ⚲'); return null; }
    if(GROQ_KEY && GROQ_KEY.length>20){
        try{ let result=await callGroq(messages); if(result) return result; } catch(e){ console.log('GROQ failed:',e); }
    }
    if(CEREBRAS_KEY && CEREBRAS_KEY.length>10){
        try{ let result=await callCerebras(messages); if(result) return result; } catch(e){ console.log('Cerebras failed:',e); }
    }
    if(!GROQ_KEY && !CEREBRAS_KEY) return "⚲ No API keys found. Tap ☰ → Settings → API Keys to add them. ⚲";
    updateStatusMessage('⚲ Connection issue — check internet and API keys ⚲');
    return null;
}

async function handleSend(){
    let inputEl = document.getElementById('user-input');
    let text = inputEl.value.trim();
    if(!text) return;
    resetTextareaHeight();
    captureSeekerName(text);
    let current=getCurrentSession();
    let updatedMessages=[...current.messages,{role:'user',content:text,timestamp:Date.now()}];
    updateCurrentSessionMessages(updatedMessages);
    let container=document.getElementById('chat-target');
    let indicator=document.createElement('div');
    indicator.className='bubble assistant';
    indicator.style.opacity='0.5';
    indicator.style.fontStyle='italic';
    indicator.innerHTML='⚲ Kinari listens... ⚲';
    container.appendChild(indicator);
    scrollToBottom();
    let assistantText = await callAI(updatedMessages);
    indicator.remove();
    if (!assistantText) { let fixedMessages = updatedMessages.slice(0,-1); updateCurrentSessionMessages(fixedMessages); return; }
    detectThresholdCompletion(assistantText, updatedMessages);
    let finalMessages=[...updatedMessages,{role:'assistant',content:assistantText,timestamp:Date.now()}];
    updateCurrentSessionMessages(finalMessages);
    if(speechOutputEnabled && speechFirstInteraction) speakText(assistantText);
}

function toggleSpeechOutput(){ speechOutputEnabled = !speechOutputEnabled; window.speechOutputEnabled = speechOutputEnabled; localStorage.setItem('KINARI_SPEECH', speechOutputEnabled); let btn = document.getElementById('speech-toggle'); if(btn) btn.style.opacity = speechOutputEnabled ? '1' : '0.5'; }
function openKeySettings(){ let g=prompt("GROQ API KEY:", GROQ_KEY); let c=prompt("CEREBRAS API KEY:", CEREBRAS_KEY); if(g?.trim()) GROQ_KEY=g.trim(); if(c?.trim()) CEREBRAS_KEY=c.trim(); localStorage.setItem('KINARI_GROQ_KEY',GROQ_KEY); localStorage.setItem('KINARI_CEREBRAS_KEY',CEREBRAS_KEY); groqKey=GROQ_KEY; cerebrasKey=CEREBRAS_KEY; updateAPIStatus(); }
function setUserName() { let n=prompt("Enter your name:", userName || ""); if(n?.trim()){ userName=n.trim(); localStorage.setItem('KINARI_USER_NAME',userName); updateUserNameDisplay(); let cur=getCurrentSession(); if(cur&&cur.messages.length===0){ let wm={role:'assistant',content:`⚲ I see you, ${userName}. This is a temple of truth. Speak, and I will listen. ⚲`,timestamp:Date.now()}; updateCurrentSessionMessages([wm]); } } }
function newSession(){ let newId=generateId(); sessions.unshift({id:newId,name:"Silent Current",messages:[],updatedAt:Date.now()}); currentSessionId=newId; currentSessionIdForTracking=newId; persistSessions(); renderSidebarSessions(); renderChat(); closeSidebar(); }
function renameSession(id){ let s=sessions.find(s=>s.id===id); if(!s) return; let n=prompt("Rename:",s.name); if(n?.trim()){ s.name=n.trim().slice(0,40); persistSessions(); renderSidebarSessions(); } }
function deleteSession(id){ if(sessions.length===1){ alert("Cannot delete only session."); return; } sessions=sessions.filter(s=>s.id!==id); if(currentSessionId===id) currentSessionId=sessions[0].id; currentSessionIdForTracking=currentSessionId; persistSessions(); renderSidebarSessions(); renderChat(); }
function switchSession(id){ if(currentSessionId===id) return; currentSessionId=id; currentSessionIdForTracking=id; renderChat(); renderSidebarSessions(); closeSidebar(); }
function formatTimestamp(ts){ return new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
function scrollToBottom(){ let d=document.getElementById('messages'); if(d) setTimeout(()=>d.scrollTop=d.scrollHeight,100); }
async function renderChat(){
    let container=document.getElementById('chat-target');
    let session=getCurrentSession();
    if(!session.messages.length){ container.innerHTML='<div style="text-align:center;opacity:0.4;margin-top:80px;font-size:0.8rem">⚲ KINARI AWAITS TRUTH ⚲</div>'; return; }
    let html='';
    for(let msg of session.messages){
        let role=msg.role==='assistant'?'assistant':'user';
        let content = msg.role==='assistant' ? await marked.parse(msg.content) : escapeHtml(msg.content);
        html+=`<div class="bubble ${role}">${content}<span class="timestamp">${formatTimestamp(msg.timestamp)}</span></div>`;
    }
    container.innerHTML=html;
    scrollToBottom();
}
function renderSidebarSessions(){
    let list=document.getElementById('session-list'); if(!list) return; list.innerHTML='';
    sessions.forEach(session=>{
        let div=document.createElement('div'); div.className='session-item';
        div.innerHTML=`<span class="session-name">${escapeHtml(session.name)}</span><span class="session-date">${new Date(session.updatedAt).toLocaleDateString()}</span><div class="session-menu"><button class="session-menu-btn">⋮</button><div class="session-dropdown"><button class="rename-option">✎ Rename</button><button class="delete-option">🗑 Delete</button></div></div>`;
        div.querySelector('.session-name').addEventListener('click',()=>switchSession(session.id));
        let menuBtn=div.querySelector('.session-menu-btn'); let dropdown=div.querySelector('.session-dropdown');
        menuBtn.addEventListener('click',(e)=>{ e.stopPropagation(); document.querySelectorAll('.session-dropdown').forEach(d=>d.classList.remove('show')); dropdown.classList.toggle('show'); });
        div.querySelector('.rename-option').addEventListener('click',(e)=>{ e.stopPropagation(); renameSession(session.id); });
        div.querySelector('.delete-option').addEventListener('click',(e)=>{ e.stopPropagation(); if(confirm('Delete this conversation?')) deleteSession(session.id); });
        list.appendChild(div);
    });
}
function shareConversation(){ let cur=getCurrentSession(); if(!cur.messages.length) return; let txt=`⚲ KINARI — VOICE OF TRUTH ⚲\n\n`; cur.messages.forEach(m=>txt+=`${m.role==='assistant'?'⚲ Kinari':'✦ You'}: ${m.content}\n\n`); navigator.clipboard.writeText(txt).then(()=>alert("📜 Conversation copied.")); }
function escapeHtml(str){ if(!str) return ''; return str.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebar-overlay').classList.remove('active'); }
function openSidebar(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebar-overlay').classList.add('active'); }
function closeAllDropdowns(){ document.querySelectorAll('.session-dropdown').forEach(d=>d.classList.remove('show')); }

document.addEventListener('DOMContentLoaded',function(){
    loadAllData(); setTheme(currentTheme); renderChat(); renderSidebarSessions();
    setTimeout(()=>initTTS(),500);
    if(!navigator.onLine) updateStatusMessage('⚲ No internet — viewing cached threads only ⚲');
    let sb=document.getElementById('speech-toggle'); if(sb) sb.style.opacity = speechOutputEnabled ? '1' : '0.5';
    groqKey=GROQ_KEY; cerebrasKey=CEREBRAS_KEY; updateAPIStatus(); updateUserNameDisplay();
    let ta=document.getElementById('user-input'); ta?.addEventListener('input',autoResizeTextarea);
    let settingsBtn=document.getElementById('settings-main-btn'); let submenu=document.getElementById('settings-submenu');
    if(settingsBtn&&submenu){
        settingsBtn.addEventListener('click',(e)=>{ e.stopPropagation(); submenu.classList.toggle('show'); settingsBtn.innerHTML=submenu.classList.contains('show')?'⚙️ Settings ▲':'⚙️ Settings ▼'; });
    }
    document.querySelectorAll('.theme-chip').forEach(chip=>{ chip.addEventListener('click',()=>{ let t=chip.getAttribute('data-theme'); if(t) setTheme(t); }); });
    document.getElementById('menu-toggle')?.addEventListener('click',openSidebar);
    document.getElementById('close-sidebar')?.addEventListener('click',closeSidebar);
    document.getElementById('sidebar-overlay')?.addEventListener('click',closeSidebar);
    document.getElementById('new-session-btn')?.addEventListener('click',()=>{ newSession(); closeSidebar(); });
    document.getElementById('settings-btn')?.addEventListener('click',()=>{ openKeySettings(); closeSidebar(); });
    document.getElementById('set-name-btn')?.addEventListener('click',()=>{ setUserName(); closeSidebar(); });
    document.getElementById('reset-memory-btn')?.addEventListener('click',()=>{ resetSeekerMemory(); closeSidebar(); });
    document.getElementById('send-btn')?.addEventListener('click',handleSend);
    document.getElementById('share-btn-top')?.addEventListener('click',shareConversation);
    document.getElementById('speech-toggle')?.addEventListener('click',toggleSpeechOutput);
    let inputTa=document.getElementById('user-input'); inputTa?.addEventListener('keydown',(e)=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); handleSend(); } });
    document.addEventListener('click', closeAllDropdowns);
});
})();
</script>

<!-- Native TTS Bridge for Capacitor -->
<script>
(function() {
    const checkCapacitor = setInterval(() => {
        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.TTS) {
            clearInterval(checkCapacitor);
            const tts = window.Capacitor.Plugins.TTS;
            if (tts) {
                window.speakText = function(text) {
                    if (!window.speechOutputEnabled) return;
                    if (!text || text.length < 2) return;
                    let clean = text.replace(/[⚲◬⌇⨀∅∞✨★☆💫🌟⭐]/g, '').replace(/\n/g, ' ').trim();
                    if (clean.length > 1) tts.speak({ text: clean });
                };
            }
        }
    }, 100);
})();
</script>
